# ER:ON — 엣지 리버스 프록시
#
#   /api/  · /docs · /openapi.json  →  backend  (FastAPI)
#   그 외                            →  frontend (TanStack Start SSR)
#
# 프론트와 API 가 동일 오리진이 되므로 브라우저는 상대 경로로 호출하면 되고,
# CORS 가 필요 없어진다.
#
# ━━ HTTP / HTTPS 구성 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 이 파일은 :80 만 정의한다. HTTPS 는 tls.d 로 마운트되는 디렉터리가 결정한다.
#
#   로컬  NGINX_TLS_DIR=./nginx/tls-enabled   (비어 있음) → :80 이 앱을 서빙
#   OCI   NGINX_TLS_DIR=./nginx/tls-available            → :443 추가 + :80 은 리다이렉트
#
# tls-available/eron-tls.conf 는 eron.co.kr 이름으로 :80 server 를 하나 더 연다.
# nginx 는 이름 일치를 default_server 보다 먼저 고르므로, 도메인으로 들어온 요청만
# HTTPS 로 넘어가고 IP 직접 접속 등 나머지는 아래 default_server 가 받는다.

# Docker 컨테이너 재생성 시 IP가 바뀌어도 Nginx를 함께 재시작하지 않도록
# Docker 내장 DNS를 통해 upstream 주소를 주기적으로 다시 해석한다.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream eron_backend {
    zone eron_backend 64k;
    server backend:8000 resolve;
}

upstream eron_frontend {
    zone eron_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 80 default_server;
    server_name _;

    # 인증서 최초 발급 시점에는 아직 HTTPS server 가 없다. 그때도 챌린지가
    # 응답되도록 default_server 에도 둔다. webroot 는 certbot 이 쓰고 여기서 읽는다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/eron-proxy.inc;
}

# HTTPS server 블록. tls-enabled(기본)는 비어 있어 로컬에서는 아무것도 읽지 않는다.
# 일치하는 파일이 없어도 nginx 는 오류를 내지 않는다.
include /etc/nginx/tls.d/*.conf;
