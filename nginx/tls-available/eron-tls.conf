# ER:ON — HTTPS (OCI 배포 전용)
#
# .env 에 NGINX_TLS_DIR=./nginx/tls-available 를 지정하면 이 파일이
# /etc/nginx/tls.d/ 로 마운트되어 conf.d/eron.conf 의 include 로 읽힌다.
# 기본값(tls-enabled)은 비어 있으므로 로컬 개발에는 영향이 없다.
#
# 인증서는 호스트 certbot 이 webroot 방식으로 발급/갱신하고, nginx 는
# ${LETSENCRYPT_DIR} 마운트를 통해 읽기 전용으로 참조한다.
# 갱신 자동화는 deploy/certbot/ 의 systemd timer 가 맡는다.

# --- HTTP(80) → HTTPS(443) 리다이렉트 -------------------------------------
#
# conf.d/eron.conf 의 default_server 와 함께 :80 을 듣는다. nginx 는 server_name
# 일치를 default_server 보다 우선하므로, 아래 두 도메인으로 온 요청만 여기로 온다.
server {
    listen 80;
    server_name eron.co.kr www.eron.co.kr;

    # 갱신 챌린지는 리다이렉트보다 먼저 매칭되어야 한다.
    # certbot 이 이 경로에 파일을 쓰고 Let's Encrypt 가 HTTP 로 읽어간다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS(443) 본 서비스 --------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name eron.co.kr www.eron.co.kr;

    # 인증서에는 두 도메인이 모두 SAN 으로 들어 있어야 한다.
    #   certbot certonly --webroot -w /var/www/certbot \
    #     --cert-name eron.co.kr -d eron.co.kr -d www.eron.co.kr
    ssl_certificate     /etc/letsencrypt/live/eron.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eron.co.kr/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    include /etc/nginx/conf.d/eron-proxy.inc;
}
