services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: eron-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - eron_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - eron-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eron-backend
    restart: unless-stopped

    ports:
      - "8100:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - eron-network


volumes:

  eron_postgres_data:
    name: eron-postgres-data


networks:

  eron-network:
    name: eron-network
    driver: bridge