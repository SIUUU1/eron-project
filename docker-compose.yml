services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: eron-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 데모 시간축과 now() 비교가 어긋나지 않도록 컨테이너 시계를 맞춘다
      TZ: ${TZ:-Asia/Seoul}
      PGTZ: ${TZ:-Asia/Seoul}

    ports:
      - "5433:5432"

    volumes:
      - eron_postgres_data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때만 실행된다. 이미 초기화된 DB 에는
      # database/scripts/load_subset.py 가 같은 SQL 을 다시 적용한다.
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - eron-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eron-backend
    restart: unless-stopped

    # nginx 를 거치지 않고 Swagger·헬스체크에 직접 접근하기 위해 유지한다
    ports:
      - "8100:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PREDICT_AI_URL: ${PREDICT_AI_URL:-}
      # clinical profile이 꺼져 있어도 backend 자체는 기동하며,
      # 초안 endpoint만 연결 실패를 503으로 반환한다.
      RECORD_AI_URL: ${RECORD_AI_URL:-http://clinicalnlp:8765}
      CLINICAL_RECORD_AI_TIMEOUT_SECONDS: ${CLINICAL_RECORD_AI_TIMEOUT_SECONDS:-180}
      # stt profile이 꺼져 있으면 음성 초안 endpoint만 503을 반환한다.
      # 오래된 로컬 STT_URL이 내부 서비스 주소를 덮어쓰지 못하게 고정한다.
      STT_URL: http://whisper:8780
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-300}
      STT_POLL_INTERVAL_SECONDS: ${STT_POLL_INTERVAL_SECONDS:-0.5}
      # nginx 뒤에서는 동일 오리진이라 CORS 가 필요 없다.
      # 컨테이너 밖에서 vite dev 를 띄울 때만 채운다.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - eron-network


  clinicalnlp:
    profiles:
      - clinical

    build:
      context: ./services/clinicalnlp
      dockerfile: Dockerfile

    container_name: eron-clinicalnlp
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    # 실제 Ollama API key는 이 Git 제외 파일에만 둔다.
    # required=false이므로 clinical profile을 사용하지 않는 기존 실행은 영향을 받지 않는다.
    env_file:
      - path: ./services/clinicalnlp/.env
        required: false

    environment:
      # 의료용어·KCD·정책·별칭·Vector 검색은 PostgreSQL만 사용한다.
      CLINICALNLP_DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      postgres:
        condition: service_healthy

    # backend가 Docker 내부 DNS 이름 clinicalnlp:8765로만 호출한다.
    # 호스트나 OCI public ingress에는 공개하지 않는다.
    expose:
      - "8765"

    volumes:
      # scispaCy 모델과 UMLS linker cache만 파일 자산으로 유지한다.
      - type: bind
        source: ${CLINICALNLP_RUNTIME_ROOT:-./runtime/clinicalnlp}/scispacy
        target: /runtime/scispacy
        read_only: true
        bind:
          create_host_path: false

    networks:
      - eron-network


  whisper:
    profiles:
      - stt

    build:
      context: ./services/whisper
      dockerfile: Dockerfile

    container_name: eron-whisper
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    # Groq API key는 이 Git 제외 파일에만 둔다.
    env_file:
      - path: ./services/whisper/.env
        required: false

    environment:
      STT_PROVIDER: groq
      STT_RUNTIME_DIR: /runtime/state
      STT_CLOUD_WORKERS: ${STT_CLOUD_WORKERS:-3}
      STT_MAX_UPLOAD_MB: ${STT_MAX_UPLOAD_MB:-25}
      STT_MAX_AUDIO_DURATION_SECONDS: ${STT_MAX_AUDIO_DURATION_SECONDS:-7200}
      TZ: ${TZ:-Asia/Seoul}

    # backend가 Docker 내부 DNS 이름 whisper:8780으로만 호출한다.
    expose:
      - "8780"

    volumes:
      - eron_whisper_state:/runtime/state

    networks:
      - eron-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: eron-frontend
    restart: unless-stopped

    # nginx 를 통해서만 접근한다. 호스트로 공개하지 않는다.
    expose:
      - "3000"

    environment:
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      - backend

    networks:
      - eron-network


  nginx:
    image: nginx:1.27-alpine
    container_name: eron-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    environment:
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      - frontend
      - backend

    networks:
      - eron-network


volumes:

  eron_postgres_data:
    name: eron-postgres-data

  eron_whisper_state:
    name: eron-whisper-state


networks:

  eron-network:
    name: eron-network
    driver: bridge
