services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: eron-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 데모 시간축과 now() 비교가 어긋나지 않도록 컨테이너 시계를 맞춘다
      TZ: ${TZ:-Asia/Seoul}
      PGTZ: ${TZ:-Asia/Seoul}

    ports:
      - "5433:5432"

    volumes:
      - eron_postgres_data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때만 실행된다. 이미 초기화된 DB 에는
      # database/scripts/load_subset.py 가 같은 SQL 을 다시 적용한다.
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - eron-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eron-backend
    restart: unless-stopped

    # nginx 를 거치지 않고 Swagger·헬스체크에 직접 접근하기 위해 유지한다
    ports:
      - "8100:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      # risk profile 이 꺼져 있어도 backend 자체는 기동하며,
      # 예측 endpoint 만 연결 실패를 503 으로 반환한다.
      PREDICT_AI_URL: ${PREDICT_AI_URL:-http://riskmodel:8790}
      # 위험구간 경계. artifacts/bundle.json["risk_bands"] 실측값이며 .env 에서 온다.
      # 비워두면 core/config.py 의 기본값(같은 실측값)이 쓰인다.
      # ⚠ 저장소 옛 기본값(0.30/0.60/0.80)을 쓰면 거의 전원이 stable 로 표시된다.
      RISK_WATCH: ${RISK_WATCH:-}
      RISK_RISING: ${RISK_RISING:-}
      RISK_CRITICAL: ${RISK_CRITICAL:-}
      # feature 순서·itemid·운영점의 정본. repositories/ml_features.py 가 읽는다.
      ARTIFACTS_DIR: /app/artifacts
      PREDICT_AI_TIMEOUT_SECONDS: ${PREDICT_AI_TIMEOUT_SECONDS:-60}
      # 데모 시계가 흐르면 새 예측 시점이 생긴다. 주기적으로 따라간다.
      PREDICT_SCHEDULER_ENABLED: ${PREDICT_SCHEDULER_ENABLED:-true}
      # 폴링 주기. 실제 실행은 15분 슬롯(00/15/30/45)이 바뀐 주기에만 일어난다.
      PREDICT_SCHEDULER_INTERVAL_SECONDS: ${PREDICT_SCHEDULER_INTERVAL_SECONDS:-60}
      # 한 슬롯 안에서 riskmodel 동시 호출 수 (riskmodel 은 워커 1개다)
      PREDICT_BATCH_CONCURRENCY: ${PREDICT_BATCH_CONCURRENCY:-4}
      # clinical profile이 꺼져 있어도 backend 자체는 기동하며,
      # 초안 endpoint만 연결 실패를 503으로 반환한다.
      RECORD_AI_URL: ${RECORD_AI_URL:-http://clinicalnlp:8765}
      CLINICAL_RECORD_AI_TIMEOUT_SECONDS: ${CLINICAL_RECORD_AI_TIMEOUT_SECONDS:-180}
      KCD_ALIAS_DB_PATH: /runtime/medical-dictionaries/ERON_응급의학용어_DB_v1.sqlite
      # stt profile이 꺼져 있으면 음성 초안 endpoint만 503을 반환한다.
      # 오래된 로컬 STT_URL이 내부 서비스 주소를 덮어쓰지 못하게 고정한다.
      STT_URL: http://whisper:8780
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-300}
      STT_POLL_INTERVAL_SECONDS: ${STT_POLL_INTERVAL_SECONDS:-0.5}
      # nginx 뒤에서는 동일 오리진이라 CORS 가 필요 없다.
      # 컨테이너 밖에서 vite dev 를 띄울 때만 채운다.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TZ: ${TZ:-Asia/Seoul}

    volumes:
      - type: bind
        source: ${CLINICALNLP_RUNTIME_ROOT:-./runtime/clinicalnlp}/medical-dictionaries
        target: /runtime/medical-dictionaries
        read_only: true
        bind:
          create_host_path: false
      # bundle.json 의 itemid·feature 목록만 읽는다(모델 가중치는 riskmodel 만 쓴다).
      # 읽기전용 bind 라 34MB 를 복사하지 않는다.
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - eron-network


  riskmodel:
    profiles:
      - risk

    build:
      context: ./services/riskmodel
      dockerfile: Dockerfile

    container_name: eron-riskmodel
    restart: unless-stopped
    init: true

    environment:
      ARTIFACTS_DIR: /app/artifacts
      TZ: ${TZ:-Asia/Seoul}

    # backend 가 Docker 내부 DNS 이름 riskmodel:8790 으로만 호출한다.
    expose:
      - "8790"

    volumes:
      # 🔑 artifacts/ 는 저장소 루트에 둔다(= build context 밖).
      #    34MB 모델을 이미지에 넣지 않기 위함이며 clinicalnlp 와 같은 방식이다.
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false

    networks:
      - eron-network


  clinicalnlp:
    profiles:
      - clinical

    build:
      context: ./services/clinicalnlp
      dockerfile: Dockerfile

    container_name: eron-clinicalnlp
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    # 실제 Ollama API key는 이 Git 제외 파일에만 둔다.
    # required=false이므로 clinical profile을 사용하지 않는 기존 실행은 영향을 받지 않는다.
    env_file:
      - path: ./services/clinicalnlp/.env
        required: false

    environment:
      # 의료용어·KCD·정책·별칭·Vector 검색은 PostgreSQL만 사용한다.
      CLINICALNLP_DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      postgres:
        condition: service_healthy

    # backend가 Docker 내부 DNS 이름 clinicalnlp:8765로만 호출한다.
    # 호스트나 OCI public ingress에는 공개하지 않는다.
    expose:
      - "8765"

    volumes:
      # scispaCy 모델과 UMLS linker cache만 파일 자산으로 유지한다.
      - type: bind
        source: ${CLINICALNLP_RUNTIME_ROOT:-./runtime/clinicalnlp}/scispacy
        target: /runtime/scispacy
        read_only: true
        bind:
          create_host_path: false

    networks:
      - eron-network


  whisper:
    profiles:
      - stt

    build:
      context: ./services/whisper
      dockerfile: Dockerfile

    container_name: eron-whisper
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    # Groq API key는 이 Git 제외 파일에만 둔다.
    env_file:
      - path: ./services/whisper/.env
        required: false

    environment:
      STT_PROVIDER: groq
      STT_RUNTIME_DIR: /runtime/state
      STT_CLOUD_WORKERS: ${STT_CLOUD_WORKERS:-3}
      STT_MAX_UPLOAD_MB: ${STT_MAX_UPLOAD_MB:-25}
      STT_MAX_AUDIO_DURATION_SECONDS: ${STT_MAX_AUDIO_DURATION_SECONDS:-7200}
      TZ: ${TZ:-Asia/Seoul}

    # backend가 Docker 내부 DNS 이름 whisper:8780으로만 호출한다.
    expose:
      - "8780"

    volumes:
      - eron_whisper_state:/runtime/state

    networks:
      - eron-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: eron-frontend
    restart: unless-stopped

    # nginx 를 통해서만 접근한다. 호스트로 공개하지 않는다.
    expose:
      - "3000"

    environment:
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      - backend

    networks:
      - eron-network


  nginx:
    image: nginx:1.27-alpine
    container_name: eron-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      # 도메인 전환 기간의 롤백 경로. HTTPS 가 안정되면 제거한다.
      - "8080:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # HTTPS server 블록을 담는 디렉터리. eron.conf 가 tls.d/*.conf 를 include 한다.
      # 기본값(tls-enabled)은 비어 있어 로컬에서는 :80 만 뜬다.
      # OCI 에서는 .env 의 NGINX_TLS_DIR=./nginx/tls-available 로 HTTPS 를 켠다.
      - ${NGINX_TLS_DIR:-./nginx/tls-enabled}:/etc/nginx/tls.d:ro
      # 호스트에 설치한 certbot 이 발급한 인증서를 그대로 읽는다.
      # certbot 컨테이너를 두지 않으므로 갱신도 호스트 systemd timer 가 맡는다.
      - ${LETSENCRYPT_DIR:-./runtime/letsencrypt}:/etc/letsencrypt:ro
      # HTTP-01 챌린지 webroot. 호스트 certbot 이 쓰고 nginx 가 읽는다.
      - ${CERTBOT_WEBROOT:-./runtime/certbot}:/var/www/certbot:ro

    environment:
      TZ: ${TZ:-Asia/Seoul}

    depends_on:
      - frontend
      - backend

    networks:
      - eron-network


volumes:

  eron_postgres_data:
    name: eron-postgres-data

  eron_whisper_state:
    name: eron-whisper-state


networks:

  eron-network:
    name: eron-network
    driver: bridge
